[package]
name = "vsomeip"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
napi-build = "2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[build-dependencies]
napi-build = "2"
